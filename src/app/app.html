<a class="visually-hidden" href="#main">Skip to content</a>

<header class="header">
  <div class="wrap header__inner">
    <a class="wordmark" routerLink="/" aria-label="Belisle for Birchwood — home">
      Belisle <em>for</em> Birchwood
    </a>

    <nav class="nav" aria-label="Main">
      <a
        class="nav__link"
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
      >
      <a class="nav__link" routerLink="/meet-ashley" routerLinkActive="is-active">Meet Ashley</a>
      <a class="nav__link" routerLink="/connect" routerLinkActive="is-active">Connect</a>
    </nav>
  </div>
</header>

<main id="main">
  <router-outlet />
</main>

<footer class="footer">
  <div class="wrap">
    <div class="footer__rule" aria-hidden="true"></div>
    <p>{{ site.disclaimer }}</p>
    <p>{{ site.address }}</p>
    <p><a [href]="'mailto:' + site.email">{{ site.email }}</a></p>
  </div>
</footer>
