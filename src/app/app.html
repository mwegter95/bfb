<a class="visually-hidden" href="#main">Skip to content</a>

<header class="header">
  <div class="wrap header__inner">
    <a class="wordmark" routerLink="/" aria-label="Belisle for Birchwood — home">
      Belisle <em>for</em> Birchwood
    </a>

    <nav class="nav" aria-label="Main">
      <a
        class="nav__link"
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
      >
      <a class="nav__link" routerLink="/meet-ashley" routerLinkActive="is-active">Meet Ashley</a>
      <a class="nav__link" routerLink="/connect" routerLinkActive="is-active">Connect</a>
    </nav>
  </div>
</header>

<main id="main">
  <router-outlet />
</main>

<footer class="footer">
  <!--
    The "prepared and paid for" disclaimer has to stay on the page, but Google was
    pulling the street address and email into the search snippet. data-nosnippet
    excludes this block from snippets; it only works on span, div and section, and
    must be present in the served HTML (never toggled by JS).
  -->
  <div class="wrap" data-nosnippet>
    <p>{{ site.disclaimer }}</p>
    <p>{{ site.address }}</p>
    <p><a [href]="'mailto:' + site.email">{{ site.email }}</a></p>
  </div>
</footer>
